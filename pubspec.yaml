name: empucad
description: EmpuCAD - offline 3D design, CNC and laser CAD. Flutter port of DabbleCAD with a Rust geometry/CAM engine.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0 # no riverpod_generator, no freezed: providers are written by hand
  file_selector: ^1.0.3
  vector_math: ^2.1.4
  empucad_engine:
    path: packages/empucad_engine # Rust engine as a Flutter FFI plugin
  # flutter_scene is pre-1.0 and ships breaking changes in minor versions; keep this pinned and
  # read its CHANGELOG before bumping. Source reviewed for this port: main at 0.24.x.
  flutter_scene: ^0.24.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
